<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
<title id="title">4WD Robot Car AI Driver</title>
<desc id="desc">A top-down robot car with its camera view and ultrasonic range cone, beside the loop the driver runs: see, decide with a local vision model, act in short bursts, and a guard on the Pi that can stop the car.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#16202b"/>
    <stop offset="1" stop-color="#0b1117"/>
  </linearGradient>
  <radialGradient id="glow" cx=".78" cy=".5" r=".45">
    <stop offset="0" stop-color="#38bdf8" stop-opacity=".16"/>
    <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
  </pattern>
  <linearGradient id="cam" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#38bdf8" stop-opacity=".35"/>
    <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sonic" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#f59e0b" stop-opacity=".45"/>
    <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
  </linearGradient>
  <style>
    .sans{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Menlo,Consolas,monospace}
    .ping{animation:ping 1.6s ease-out infinite;transform-origin:1000px 150px}
    .ping2{animation:ping 1.6s ease-out .8s infinite;transform-origin:1000px 150px}
    @keyframes ping{from{opacity:.9;transform:scale(.3)}to{opacity:0;transform:scale(1.25)}}
    .dash{stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-28}}
    .blink{animation:blink 1.4s steps(1) infinite}
    @keyframes blink{50%{opacity:.25}}
  </style>
</defs>

<rect width="1280" height="400" rx="20" fill="url(#bg)"/>
<rect width="1280" height="400" rx="20" fill="url(#grid)"/>
<rect width="1280" height="400" rx="20" fill="url(#glow)"/>
<rect x=".75" y=".75" width="1278.5" height="398.5" rx="19.5" fill="none" stroke="#263545" stroke-width="1.5"/>

<!-- left: title -->
<g class="sans">
  <g transform="translate(64 72)">
    <rect width="292" height="28" rx="14" fill="#38bdf8" fill-opacity=".1" stroke="#38bdf8" stroke-opacity=".45"/>
    <circle cx="16" cy="14" r="4" fill="#22c55e" class="blink"/>
    <text class="mono" x="29" y="18.5" font-size="12" letter-spacing="1.4" fill="#bae6fd">RASPBERRY PI · LOCAL VISION LLM</text>
  </g>
  <text x="62" y="160" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#f1f5f9">4WD Robot Car</text>
  <text x="62" y="222" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#38bdf8">AI Driver</text>
  <text x="64" y="264" font-size="19" fill="#94a3b8">A laptop dashboard and closed-loop Ollama controller for</text>
  <text x="64" y="290" font-size="19" fill="#94a3b8">the Freenove 4WD Smart Car Kit, with a safety guard on the Pi.</text>
  <g class="mono" font-size="13">
    <g transform="translate(64 318)">
      <rect width="118" height="32" rx="6" fill="#0f1720" stroke="#263545"/>
      <text x="14" y="21" fill="#38bdf8">see</text><text x="48" y="21" fill="#64748b">camera</text>
    </g>
    <g transform="translate(190 318)">
      <rect width="134" height="32" rx="6" fill="#0f1720" stroke="#263545"/>
      <text x="14" y="21" fill="#a78bfa">decide</text><text x="72" y="21" fill="#64748b">Ollama</text>
    </g>
    <g transform="translate(332 318)">
      <rect width="130" height="32" rx="6" fill="#0f1720" stroke="#263545"/>
      <text x="14" y="21" fill="#22c55e">act</text><text x="48" y="21" fill="#64748b">≤ 0.75 s</text>
    </g>
    <g transform="translate(470 318)">
      <rect width="136" height="32" rx="6" fill="#0f1720" stroke="#263545"/>
      <text x="14" y="21" fill="#f59e0b">guard</text><text x="64" y="21" fill="#64748b">30 cm</text>
    </g>
  </g>
</g>

<!-- right: top-down car -->
<g>
  <!-- camera frustum -->
  <path d="M1000 150 L880 30 L1120 30 Z" fill="url(#cam)"/>
  <path d="M1000 150 L880 30 M1000 150 L1120 30" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1.2"/>
  <!-- ultrasonic cone + pings -->
  <path d="M1000 150 L960 70 Q1000 58 1040 70 Z" fill="url(#sonic)"/>
  <circle cx="1000" cy="150" r="70" fill="none" stroke="#f59e0b" stroke-width="2" class="ping"/>
  <circle cx="1000" cy="150" r="70" fill="none" stroke="#f59e0b" stroke-width="2" class="ping2"/>
  <!-- obstacle -->
  <rect x="1046" y="44" width="46" height="22" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-opacity=".7"/>
  <text class="mono" x="1069" y="59" font-size="10" text-anchor="middle" fill="#fbbf24">84 cm</text>

  <!-- wheels -->
  <rect x="922" y="166" width="26" height="54" rx="6" fill="#0b0f14" stroke="#334155"/>
  <rect x="1052" y="166" width="26" height="54" rx="6" fill="#0b0f14" stroke="#334155"/>
  <rect x="922" y="268" width="26" height="54" rx="6" fill="#0b0f14" stroke="#334155"/>
  <rect x="1052" y="268" width="26" height="54" rx="6" fill="#0b0f14" stroke="#334155"/>
  <!-- chassis -->
  <rect x="944" y="150" width="112" height="190" rx="16" fill="#1f2a37" stroke="#475569" stroke-width="1.5"/>
  <rect x="958" y="196" width="84" height="64" rx="6" fill="#14532d" stroke="#22c55e" stroke-opacity=".6"/>
  <text class="mono" x="1000" y="224" font-size="11" text-anchor="middle" fill="#bbf7d0">Raspberry Pi</text>
  <text class="mono" x="1000" y="242" font-size="10" text-anchor="middle" fill="#86efac">driver_guard</text>
  <rect x="972" y="276" width="56" height="44" rx="4" fill="#0f1720" stroke="#334155"/>
  <text class="mono" x="1000" y="302" font-size="10" text-anchor="middle" fill="#64748b">battery</text>
  <!-- sensor head -->
  <rect x="978" y="150" width="44" height="18" rx="4" fill="#0f1720" stroke="#f59e0b" stroke-opacity=".8"/>
  <circle cx="990" cy="159" r="5" fill="#1e293b" stroke="#fbbf24"/>
  <circle cx="1010" cy="159" r="5" fill="#1e293b" stroke="#fbbf24"/>
  <circle cx="1000" cy="146" r="5" fill="#38bdf8"/>

  <!-- wifi link to laptop -->
  <path d="M1080 230 C1150 230 1150 300 1196 300" fill="none" stroke="#a78bfa" stroke-width="2" class="dash"/>
  <g class="sans">
    <rect x="1132" y="306" width="120" height="58" rx="8" fill="#0f1720" stroke="#a78bfa" stroke-opacity=".6"/>
    <text class="mono" x="1192" y="330" font-size="11" text-anchor="middle" fill="#ddd6fe">laptop</text>
    <text class="mono" x="1192" y="348" font-size="10" text-anchor="middle" fill="#a78bfa">Ollama · VLM</text>
  </g>
</g>
</svg>
